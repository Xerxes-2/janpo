<!doctype html><meta charset="utf-8">
<style>
  /* 纯 CSS 缩放：--u 是「满幅时的 1px」。长度÷数值仍是长度，min() 取两者小者。 */
  :root { --u: min(calc(100vw / 1200), calc(100vh / 750)); }
  body { margin: 0; }
  #stage { width: calc(1200 * var(--u)); height: calc(750 * var(--u));
           margin: 0 auto; background: #eee; position: relative; }
  #tile { position: absolute; left: calc(600 * var(--u)); top: calc(375 * var(--u));
          width: calc(32 * var(--u)); height: calc(43 * var(--u)); background: #b43a2c; }
</style>
<div id="stage"><div id="tile"></div></div>
