# pnpm 11 默认不跑依赖的构建脚本。这里显式放行本工程需要原生二进制的那几个，
# 否则 `pnpm exec` 会直接失败（它检出「ignored build scripts」就拒绝跑）。
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  # pi-ai 拖进来的两个原生构建脚本。**显式拒掉**（false 也算「已表态」，pnpm 因此不再报
  # ERR_PNPM_IGNORED_BUILDS）：我们只按 provider 分入口导入（票 18 的结论），
  # Google 那家的 SDK 与 protobufjs 一行都不会被 import。
  '@google/genai': false
  protobufjs: false
