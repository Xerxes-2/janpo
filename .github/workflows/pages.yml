name: Pages

# 把 `web/dist`（纯静态产物，没有后端）发到 GitHub Pages。
# 只在**默认分支**推送时跑；别的分支不部署，手动重发用 workflow_dispatch。
#
# 上线前主人要在仓库里点两下：Settings → Pages → Source 选 **GitHub Actions**，
# 并确认默认分支就是下面 `branches:` 里写的那个。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 权限按 job 分（票 45）：**`id-token: write` 只给 deploy**。
# 它是 `deploy-pages` 换 Pages 部署凭据用的 OIDC 令牌，build 一步用不着；
# 而 build 里的 nix 安装器一旦看得见 OIDC 就会去登 FlakeHub，登不上便每跑印一条
# `FlakeHub Login failure: …` 告警注解（见 ci.yml 里那段注释与 45 号票报告）。
# 不给它，那条路径根本不会走到，同时也是最小权限该有的样子。

# 同时只跑一份部署，但**不取消**跑到一半的那次（取消会留下半截的发布）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages 要读（必要时建）仓库的 Pages 配置。
      pages: write
    env:
      # ★★ 部署地址的**唯一**来源：站点会挂在 https://<owner>.github.io/janpo/ 。
      #    仓库改名（或换成自定义域名，那时填 "/"）**只改这一行**，别处没有第二处写着路径。
      #    它经 vite.config.ts 的 JANPO_BASE 变成打包产物里的资源前缀。
      JANPO_BASE: /janpo/
      # 强 AI 基线那份产物在仓库里的位置（票 101）。同样只写这一行：
      # 下面取缓存与存缓存两步各引用它，两处写法不会漂。
      # （真正造它的是 `scripts/build-baseline-wasm.sh`，那份脚本本机也要单跑，
      # 所以它自己那一行路径没法从这里拿；两边对不上的下场是“发布件里没有它”，
      # 而那正是下面那道闸门大声报的那件事。）
      BASELINE_WASM: web/public/baseline/janpo-baseline.wasm
    steps:
      - uses: actions/checkout@v7

      # 与 ci.yml 同一套工具链：dotnet（跑 Fable）与 node/pnpm（打包）都由 flake.lock 钉住版本，
      # 因此 Pages 上跑的那份产物与本地 `pnpm run build` 出来的是同一条链路。
      # 钉在发布 tag 上，理由同 ci.yml。
      - uses: DeterminateSystems/nix-installer-action@v22

      # 【实测后拆掉】曾在这里挂 nix-community/cache-nix-action@v7（只读，写由 ci.yml 负责）。
      # 调度器实测冷热两跑后拆除：缓存 restore 花 20 秒、而冷拉工具链只要 18 秒——**净亏**。
      # 详见 ci.yml 里同一处注释与票 45 报告 §8。别再加，除非先量。

      # 单独一步预热，为的是能把「拉工具链」的耗时从下面几步里读出来（同 ci.yml）。
      - name: 预热 dev shell（这一步的耗时 = 拉工具链的耗时）
        run: nix develop --command true

      - name: 装依赖
        run: nix develop --command bash -c "cd web && pnpm install --frozen-lockfile"

      # Fable 是 dotnet 本地工具（.config/dotnet-tools.json 钉住版本），不 restore 就没有 `dotnet fable`。
      # `scripts/ci.sh` 自己会 restore，而这里直接调 `pnpm run build`，所以要单独来一步。
      - name: 恢复 dotnet 本地工具（Fable）
        run: nix develop --command dotnet tool restore

      # ★★ 强 AI 基线那 6 MB（票 101；ADR-0006）。
      #
      # 它**不入版本控制**（边界 6），所以发布前得在这里造一份——没人造就永远是线上那个 404。
      # 造它的输入只有三样：造法（那两个脚本）、crate 源码与锁文件、上游钉死的 commit
      # （它写在 fetch-upstream.sh 里）——**它们都不变时产物就不变**，所以缓存键就是它们的摘要。
      #
      # **为什么是缓存而不是每次现造**（票 45 的规矩：加缓存先量后加）：本机实测冷 target 目录
      # 编一遍是 **43 s**（全机 32 线程 43.1 s / 限到 4 核 43.8 s——它是串行尾巴制约，加核没用），
      # runner 单核慢一截，估 1.5–2.5 分钟；而这份缓存只有 4.8 MB（zstd 后），恢复是秒级。
      # 与票 45 那次“缓存 20 s vs 冷拉 18 s = 净亏”不同，这里两边差两个数量级。数在报告 101 里。
      #
      # 用 restore/save 拆开而不是一个 `actions/cache`：只有**造成功**那一次才存，
      # 否则一次失败的构建会把一个不存在的文件当缓存存进去。
      # 键单独算一步，为的是那三行门神：**`hashFiles` 一个文件都匹配不上时不报错，它返回空字符串**
      # （本机用 act 跑出过这一幕：键退化成 `baseline-wasm-Linux-`）。键一旦退化成常量，
      # 「上游 pin 或 crate 改了就要重造」这条不变量会**静静地失效**，
      # 站点从此永远发一份照旧源码造的产物——那比没有产物坏。
      # 同时它把那一长串 `hashFiles` 收成一处（restore 与 save 不必各写一遍）。
      - name: 算强 AI 基线产物的缓存键
        id: baseline-key
        shell: bash
        run: |
          digest='${{ hashFiles('scripts/build-baseline-wasm.sh', 'probe/akagi-wasm/fetch-upstream.sh', 'probe/akagi-wasm/crate/Cargo.toml', 'probe/akagi-wasm/crate/Cargo.lock', 'probe/akagi-wasm/crate/src/**', 'probe/akagi-wasm/crate/.cargo/config.toml') }}'
          if [[ -z "$digest" ]]; then
            echo "hashFiles 一个文件都没匹配上：造产物那几份输入的路径改了？这一步不能放行，" >&2
            echo "否则缓存键会退化成常量，站点会永远发一份照旧源码造的产物。" >&2
            exit 1
          fi
          echo "key=baseline-wasm-${{ runner.os }}-$digest" >> "$GITHUB_OUTPUT"

      - name: 取上次造好的强 AI 基线产物
        id: baseline-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BASELINE_WASM }}
          key: ${{ steps.baseline-key.outputs.key }}

      # **没造出来不阻断部署**（`continue-on-error`）。这是故意的：站点上没有这份产物时
      # 页面会**如实降级**（ADR-0006 边界 2：那一席退回自带 bot、其余席照常打完），
      # 而把整个站扣下不发会连带拦住与它无关的十几样东西——它是**可选依赖，不是单点**。
      # 它失败时那一步在 Actions 里是红的，下面那道闸门会在总结里大声说一句。
      - name: 造强 AI 基线那份产物（缓存没命中才跑；失败不阻断部署）
        id: baseline-build
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        # 不进 nix dev shell：需要的 rustup/cargo **runner 镜像自带**
        # （2026-08-19 核过 actions/runner-images 的 Ubuntu2404-Readme：Rust/Cargo 1.97.1、Rustup 1.29.0，
        # 与本机同一版）。**不把 Rust 塞进 `flake.nix`** 是量过的：那会给 dev shell
        # 再添约 470 MiB 下载 / 1.6 GiB 解开（`nix build --dry-run nixpkgs#rustc` + `#cargo`），
        # 而那份 shell **每一趟 CI 都要拉**（今天冷拉 18–21 s）——为一条只有 Pages 用得上的工具链
        # 把每趟 CI 都拖慢，不划算。
        run: ./scripts/build-baseline-wasm.sh

      - name: 存起来给下一次部署用
        if: steps.baseline-build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BASELINE_WASM }}
          key: ${{ steps.baseline-cache.outputs.cache-primary-key }}

      # `pnpm run build` = `dotnet fable ../src/Janpo.Web` + `vite build` → web/dist
      # Vite 把 `web/public/` 原样拷进 `dist/`，上面那份产物与 `third-party/` 的三份许可都走这一步。
      - name: 构建静态站（Fable + Vite）
        run: nix develop --command bash -c "cd web && pnpm run build"

      # 发出去之前核一遍发布件：**许可随产物上线**（边界 4）、产物在的话得是一份像样的 wasm。
      # 它把“这次到底发了什么”写进跑批总结（含 sha256），
      # 于是“线上那份是不是这一份”变成一句可核对的话（报告 101 的“推完看什么”）。
      #
      # `shell: bash` 不是装饰：不写它时默认壳是 `bash -e {0}`，**没有 pipefail**，
      # 于是 `脚本 | tee` 的退出码是 `tee` 的 0——这道闸门会变成一道**永远不会红的闸门**。
      # （这不是推论：本机 act 跑第一版时脚本根本没找到，那一步依旧报了 ✅。）
      - name: 核一遍发布件
        shell: bash
        run: ./scripts/check-pages-dist.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6

      # v4 起隐藏文件（dotfile）不再进包。web/dist 里没有 dotfile（vite 只出 index.html 与 assets/），
      # 且 Actions 部署不经 Jekyll、不需要 .nojekyll——将来若有 dotfile 要发布，得显式开 include-hidden-files。
      # 用 v5 而不是 v4：v4 内部钉的 upload-artifact 是 v4.6.2（Node 20，每跑必印弃用告警），v5 内部是 v7.0.0。
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
